# Onboard is not started by the kiosk session. These defaults keep a stray
# Onboard process hidden and stop it from docking or shrinking the X workarea,
# which would otherwise leave a strip under a maximized browser window.
# Chromium is launched with --kiosk --start-fullscreen and does not follow
# that workarea.

[main]
start-minimized=True
show-status-icon=False
xembed-onboard=False

[window]
window-state-sticky=True
window-decoration=False
force-to-top=False
docking-enabled=False
docking-edge=bottom
docking-shrink-workarea=False

[auto-show]
enabled=False
hide-on-key-press=False
tablet-mode-detection-enabled=False
keyboard-device-detection-enabled=False

[keyboard]
show-click-buttons=False
touch-feedback-enabled=False
