# Onboard branding file. Read when use-system-defaults is set, and again
# whenever /tmp/onboard-use-system-defaults exists (the session touches that
# file because the root filesystem is read-only and dconf writes do not stick).
#
# The keyboard stays hidden until an editable text field is focused
# (staff email and password included) and hides when focus leaves it.

[main]
start-minimized=True
show-status-icon=False
xembed-onboard=False

[window]
window-state-sticky=True
window-decoration=False
force-to-top=True
docking-enabled=True
docking-edge=bottom
docking-shrink-workarea=True

[auto-show]
enabled=True
hide-on-key-press=False
tablet-mode-detection-enabled=False
keyboard-device-detection-enabled=False

[keyboard]
show-click-buttons=False
touch-feedback-enabled=True

[gnome-desktop-interface]
toolkit-accessibility=True
