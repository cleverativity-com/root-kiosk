name: Build and release images

on:
  push:
    branches:
      - main
      - cursor/kiosk-image-release-45ec
  pull_request:

permissions:
  contents: write

jobs:
  raspberrypi:
    # This branch publishes the image from the push workflow. Skip the
    # duplicate pull_request build so the release is not raced.
    if: github.event_name != 'pull_request' || github.head_ref != 'cursor/kiosk-image-release-45ec'
    runs-on: [ubuntu-24.04-arm]

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch TBW kiosk app and API sources
        env:
          ACCLEVERATE_READ_TOKEN: ${{ secrets.ACCLEVERATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          clone_repo() {
            local name="$1"
            rm -rf third_party/accleverate-v26
            git -c "http.extraheader=AUTHORIZATION: bearer ${ACCLEVERATE_READ_TOKEN}" \
              clone --depth 1 --filter=blob:none --sparse \
              "https://github.com/cleverativity-com/${name}.git" \
              third_party/accleverate-v26 || return 1
            git -C third_party/accleverate-v26 sparse-checkout set \
              apps/tbw-root-kiosk-app \
              services/tbw-root-api || return 1
            git -C third_party/accleverate-v26 remote remove origin || true
            echo "Checked out ${name} $(git -C third_party/accleverate-v26 rev-parse HEAD)"
            pkg="third_party/accleverate-v26/apps/tbw-root-kiosk-app/package.json"
            if [ -f "${pkg}" ]; then
              python3 -c 'import json,sys; data=json.load(open(sys.argv[1], encoding="utf-8")); print("tbw-root-kiosk-app name=" + str(data.get("name") or "")); print("tbw-root-kiosk-app version=" + str(data.get("version") or ""))' "${pkg}"
            else
              echo "tbw-root-kiosk-app package.json was not in the checkout."
            fi
          }
          if [ -z "${ACCLEVERATE_READ_TOKEN}" ]; then
            echo "ACCLEVERATE_READ_TOKEN is unset."
            echo "The image will download the published kiosk UI (main deploy of tbw-root-kiosk-app) and use the bundled GPIO API."
            exit 0
          fi
          if ! clone_repo accleverate-v26 && ! clone_repo accleverate-26; then
            echo "Could not check out accleverate-v26 or accleverate-26."
            echo "The image will download the published kiosk UI and use the bundled GPIO API."
            rm -rf third_party/accleverate-v26
          fi

      - name: Install dependencies
        run: |
          sudo apt update -qq
          sudo apt install -yqq libguestfs-tools qemu-utils qemu-system-arm qemu-efi-aarch64 qemu-block-extra qemu-user-static binfmt-support rsync sudo wget xz-utils pigz mount dosfstools libarchive-tools zerofree util-linux e2fsprogs

      - name: Build arm64 (Raspberry Pi 5) firmware
        run: |
          ./build_raspberry_pi.sh "https://downloads.raspberrypi.org/raspios_lite_arm64/images/raspios_lite_arm64-2025-10-02/2025-10-01-raspios-trixie-arm64-lite.img.xz" "79146135607ffe8acac94e5ff501de6fc49583117de5ad08c45a32c73ae2a027" "arm64-raspberrypi"

      - name: Upload Raspberry Pi image
        uses: actions/upload-artifact@v4
        with:
          name: root-kiosk-arm64-raspberrypi
          path: ./root-kiosk-*.img.xz
          if-no-files-found: error
          retention-days: 14

      - name: Determine release metadata
        id: meta
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/cursor/kiosk-image-release-45ec')
        run: |
          set -euo pipefail
          short_sha="$(git rev-parse --short=7 HEAD)"
          stamp="$(date -u +%Y%m%d)"
          tag="root-kiosk-${stamp}-${short_sha}"
          {
            echo "tag=${tag}"
            echo "name=root-kiosk ${stamp} (${short_sha})"
          } >> "${GITHUB_OUTPUT}"
          ls -lh ./root-kiosk-*.img.xz

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/cursor/kiosk-image-release-45ec')
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          target_commitish: ${{ github.sha }}
          body_path: ./version-info
          files: |
            ./root-kiosk-*.img.xz
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
